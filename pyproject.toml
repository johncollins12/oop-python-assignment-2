[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oop-python-assignment-2"
version = "0.1.0"
description = "OOP with Python Assignment 2 (Advent 2026): weather forecast via web APIs and a Uganda tax engine"
authors = [{ name = "Wesonga John Collins" }]
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]
